<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        .logo-circle {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #198754;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;

            font-size: 24px;

            color: #222;

            margin-bottom: 10px;
        }

        .description {
            text-align: center;

            color: #777;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: bold;

            color: #333;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

            margin-bottom: 15px;
        }

        input:focus {
            border-color: #198754;
        }

        .button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #198754;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .button:hover {
            opacity: 0.9;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #198754;

            font-size: 14px;

            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .error {
            background: #f8d7da;

            color: #842029;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 15px;

            font-size: 14px;
        }

        @media (max-width: 500px) {

            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 21px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="logo-circle">
        TC
    </div>

    <h1>Forgot Password?</h1>

    <p class="description">
        Enter the email address associated with your
        administrator account. We will send you a link
        to reset your password.
    </p>

    {% if form.errors %}
        <div class="error">
            Please enter a valid email address.
        </div>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label for="id_email">
            Email Address
        </label>

        {{ form.email }}

        <button
            type="submit"
            class="button"
        >
            SEND RESET LINK
        </button>

    </form>

    <a
        href="{% url 'login' %}"
        class="back"
    >
        ← Back to Login
    </a>

</div>

</body>
</html>
