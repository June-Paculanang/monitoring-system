<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Check Your Email</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);

            text-align: center;
        }

        .icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #198754;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
        }

        h1 {
            font-size: 23px;

            color: #222;

            margin-bottom: 15px;
        }

        p {
            color: #666;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .back {
            display: inline-block;

            padding: 12px 20px;

            background: #198754;

            color: white;

            border-radius: 7px;

            text-decoration: none;

            font-weight: bold;

            font-size: 14px;
        }

        .back:hover {
            opacity: 0.9;
        }

        @media (max-width: 500px) {

            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 21px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="icon">
        ✓
    </div>

    <h1>Check Your Email</h1>

    <p>
        If an administrator account exists with the
        email address you entered, a password reset
        link has been sent to that email address.
    </p>

    <a
        href="{% url 'login' %}"
        class="back"
    >
        Back to Login
    </a>

</div>

</body>
</html>
