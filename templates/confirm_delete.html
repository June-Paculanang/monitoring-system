<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirm Delete | Teacher Class Monitoring</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7f6;
            color: #333;
        }

        .header {
            background: #198754;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            font-size: 25px;
        }

        .container {
            max-width: 550px;
            margin: 80px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            text-align: center;
        }

        .card h2 {
            color: #dc3545;
            margin-bottom: 15px;
        }

        .card p {
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .button {
            padding: 11px 20px;
            border-radius: 5px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .delete-button {
            background: #dc3545;
            color: white;
        }

        .delete-button:hover {
            background: #bb2d3b;
        }

        .cancel-button {
            background: #6c757d;
            color: white;
        }

        .cancel-button:hover {
            background: #565e64;
        }

        @media (max-width: 600px) {
            .container {
                margin-top: 40px;
            }

            .card {
                padding: 25px 20px;
            }

            .buttons {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Teacher Class Monitoring System</h1>
</div>

<div class="container">

    <div class="card">

        <h2>Confirm Delete</h2>

        <p>
            Are you sure you want to delete this item?
            This action cannot be undone.
        </p>

        <div class="item">
            {{ object }}
        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="buttons">

                <button
                    type="submit"
                    class="button delete-button"
                >
                    Yes, Delete
                </button>

                <a
                    href="javascript:history.back()"
                    class="button cancel-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
